<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Environmental Health Risk Explorer</title>

    <!-- Load ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.0/"></script>

    <style>
      html,
      body,
      arcgis-map {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <arcgis-map basemap="hybrid" center="-123.03,45.04" zoom="10">
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-layer-list slot="top-right"></arcgis-layer-list>
      <arcgis-legend slot="bottom-left"></arcgis-legend>
    </arcgis-map>

    <script type="module">
      const GeoJSONLayer = await $arcgis.import("@arcgis/core/layers/GeoJSONLayer.js");

      const viewElement = document.querySelector("arcgis-map");

      // Wait until the map/view is ready before adding layers
      await viewElement.viewOnReady();

      const testPointsLayer = new GeoJSONLayer({
        url: "http://localhost:5000/generic-places-data",
        title: "Cancer Prevelance",
        popupTemplate: {
          title: "{name}",
          content: "This is a test point from the Flask backend."
        },
        renderer: {
            type: "simple",
            symbol: {
              type: "simple-marker",
              size: 7,
              color: [255, 255, 255, 1],
              outline: {
                color: [0,0,0,0],
                width: 0
              }
            },
            visualVariables: [
              {
                type: "color",
                field: "hue",
                stops: [
                  {value: 100, color: [255, 0, 0, 1], label: "High"},
                  {value: 50, color: [255, 255, 0, 1], label: "Medium"},
                  {value: 0, color: [0, 180, 0, 1], label: "Low"}
                ]
              }
            ]

          }
        
        // renderer: {
        //   type: "unique-value",
        //   field: "severity_group",
        //   defaultSymbol: { type: "simple-marker", color: "white"},
        //   uniqueValueInfos:[
        //     {
        //       value: "low",
        //       symbol: {
        //       type: "simple-marker",
        //       color: [0, 220, 0, 0.0],
        //         outline: {
        //           color: [0, 0, 0, 0],
        //           width: 0
        //       }
        //       }
        //     },
        //     {
        //       value: "medium",
        //       symbol: {
        //         type: "simple-marker",
        //         color: [220, 220, 0, 0.0],
        //         outline: {
        //           color: [0, 0, 0, 0],
        //           width: 0
        //         }
        //       }
        //    },
        //     {
        //       value: "high",
        //       symbol: {
        //         type: "simple-marker",
        //         color: "red",
        //         outline: {
        //           color: [0, 0, 0, 0],
        //           width: 0
        //         }
        //       }
        //     },
        //     {
        //       value: "very-high",
        //       symbol: {
        //         type: "simple-marker",
        //         color: "black",
        //         outline: {
        //           color: [0, 0, 0, 0],
        //           width: 0
        //       }
        //     }
        //   }
        // ]
        // }
      });

      viewElement.map.add(testPointsLayer);

      // Wait for the layer to load, then zoom to it
      await viewElement.whenLayerView(testPointsLayer);

      if (testPointsLayer.fullExtent) {
        await viewElement.goTo(testPointsLayer.fullExtent.expand(2), {
          animate: true,
          duration: 1500
        });
      }
    </script>
  </body>
</html>
